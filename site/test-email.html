async function testSend(){
  const email = document.getElementById('testEmail').value.trim();
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  if(!email){ alert('اكتب إيميل أول'); return; }

  btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  result.style.display = 'none';

  try{
    const res = await fetch('/.netlify/functions/send-email', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ to: email, name: 'اختبار', pdfBase64: TEST_PDF_BASE64 })
    });
    const data = await res.json();
    result.style.display = 'block';
    if(res.ok && !data.error){
      result.className = 'ok';
      result.textContent = '✅ نجح! تحقق من بريدك (وتحقق من الـSpam لو ما وصل خلال دقيقة).\n\n' + JSON.stringify(data, null, 2);
    } else {
      result.className = 'err';
      result.textContent = '❌ فشل. هذا تفاصيل الخطأ:\n\n' + JSON.stringify(data, null, 2);
    }
  } catch(err){
    result.style.display = 'block';
    result.className = 'err';
    result.textContent = '❌ خطأ بالاتصال: ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'أرسل إيميل تجريبي';
  }
}
